<!DOCTYPE html>
<!-- web/learn.html - 学习队列查看（内部维护页，不对访客宣传）
     数据来源：GET {API_BASE}/api/learn-queue，需携带云端配置的 ADMIN_TOKEN（x-admin-token 头）。
     令牌只存在本浏览器 localStorage，不进任何公开代码仓库。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>学习队列 · 肝芽守护维护页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
      background: #FFF7F0;
      color: #4A3E39;
      padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #9B8E85; margin-bottom: 20px; }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      max-width: 860px;
      margin: 0 auto 16px;
      box-shadow: 0 2px 10px rgba(222, 160, 104, 0.08);
    }
    .token-row { display: flex; gap: 10px; }
    .token-row input {
      flex: 1;
      border: 1px solid #FBE9DA;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      color: #4A3E39;
    }
    button {
      background: #DEA068;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      font-size: 14px;
      cursor: pointer;
    }
    button.ghost { background: #FBE9DA; color: #C98A54; }
    .status { font-size: 13px; color: #9B8E85; margin-top: 10px; min-height: 18px; }
    .status.err { color: #D36C6C; }
    .item { border-top: 1px dashed #FBE9DA; padding: 14px 0; }
    .item:first-of-type { border-top: none; }
    .q { font-size: 15px; font-weight: 600; line-height: 1.5; }
    .meta { font-size: 12px; color: #C4B5AC; margin-top: 6px; display: flex; gap: 12px; align-items: center; }
    .mode { background: #FBE9DA; color: #C98A54; border-radius: 999px; padding: 2px 10px; }
    .copy { margin-left: auto; background: none; color: #C98A54; padding: 2px 6px; font-size: 12px; }
    .empty { text-align: center; color: #9B8E85; padding: 40px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>学习队列（家长问过、知识库未收录）</h1>
    <div class="sub">按时间倒序，最多 200 条。按问题补知识库后，可把对应记录标记 done（数据库 learn_queue 集合，status 字段）。</div>
    <div class="token-row">
      <input id="token" type="password" placeholder="粘贴管理令牌 ADMIN_TOKEN" />
      <button onclick="load()">查看</button>
      <button class="ghost" onclick="learnMatch()">回音检查</button>
      <button class="ghost" onclick="forget()">清除本机令牌</button>
    </div>
    <div class="sub" style="margin-top:8px">「回音检查」：知识库补录并重建索引后点一次——把 pending 问题重新过检索门控，现在能答的标记为「有回音」。确认答案质量后可把 status 改成 done。</div>
    <div id="status" class="status"></div>
  </div>

  <div class="card" id="list-card" style="display:none">
    <div id="list"></div>
  </div>

  <script src="./config.js"></script>
  <script>
    const $token = document.getElementById('token');
    const $status = document.getElementById('status');
    const $list = document.getElementById('list');
    const $listCard = document.getElementById('list-card');

    $token.value = localStorage.getItem('hb_admin_token') || '';

    function setStatus(text, isErr) {
      $status.textContent = text || '';
      $status.className = 'status' + (isErr ? ' err' : '');
    }

    function fmtTs(ts) {
      try {
        const d = new Date(ts);
        const p = (n) => (n < 10 ? '0' + n : '' + n);
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
      } catch (e) { return ts || ''; }
    }

    function copyOne(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const old = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(() => { btn.textContent = old; }, 1200);
      });
    }

    async function load() {
      const token = $token.value.trim();
      if (!token) { setStatus('请先粘贴管理令牌（ADMIN_TOKEN，在云函数环境变量里）', true); return; }
      localStorage.setItem('hb_admin_token', token);
      setStatus('加载中…');
      try {
        const res = await fetch(window.WEB_CONFIG.API_BASE + '/api/learn-queue', {
          headers: { 'x-admin-token': token },
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          setStatus((data && data.error) || ('请求失败：HTTP ' + res.status), true);
          return;
        }
        render(data.items || []);
        setStatus(`共 ${data.total} 条，显示 ${(data.items || []).length} 条`);
      } catch (err) {
        setStatus('网络错误：' + err.message, true);
      }
    }

    // 回音检查：知识库补录后把 pending 问题重新过检索门控，能答的标记 matched
    async function learnMatch() {
      const token = $token.value.trim();
      if (!token) { setStatus('请先粘贴管理令牌', true); return; }
      localStorage.setItem('hb_admin_token', token);
      setStatus('回音检查中（最多 50 条，纯检索判定，约几秒）…');
      try {
        const res = await fetch(window.WEB_CONFIG.API_BASE + '/api/learn-match', {
          method: 'POST',
          headers: { 'x-admin-token': token, 'x-hb-secret': window.WEB_CONFIG.HTTP_SHARED_SECRET || '' },
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          setStatus((data && data.error) || ('请求失败：HTTP ' + res.status), true);
          return;
        }
        setStatus(`检查完成：扫了 ${data.scanned} 条待处理问题，其中 ${data.matched} 条现在知识库能答了（已标记「有回音」）`);
        load(); // 刷新列表展示 matched 状态
      } catch (err) {
        setStatus('网络错误：' + err.message, true);
      }
    }

    function render(items) {
      $listCard.style.display = items.length ? '' : 'none';
      if (!items.length) {
        $list.innerHTML = '<div class="empty">学习队列为空——还没有家长问到知识库没收录的问题。</div>';
        return;
      }
      $list.innerHTML = '';
      items.forEach((it) => {
        const row = document.createElement('div');
        row.className = 'item';
        const q = document.createElement('div');
        q.className = 'q';
        q.textContent = it.question || '(空)';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const mode = document.createElement('span');
        mode.className = 'mode';
        mode.textContent = it.mode === 'text' ? '问答追问' : (it.mode || '');
        const time = document.createElement('span');
        time.textContent = fmtTs(it.ts);
        const st = document.createElement('span');
        if (it.status === 'done') st.textContent = '✅ 已补录';
        else if (it.status === 'matched') st.textContent = '🔊 有回音·知识库可答（待确认）';
        else st.textContent = '待处理';
        if (it.status === 'matched') { st.style.color = '#C98A54'; st.style.fontWeight = '600'; }
        const copy = document.createElement('button');
        copy.className = 'copy';
        copy.textContent = '复制问题';
        copy.onclick = () => copyOne(it.question || '', copy);
        meta.append(mode, time, st, copy);
        row.append(q, meta);
        $list.append(row);
      });
    }

    function forget() {
      localStorage.removeItem('hb_admin_token');
      $token.value = '';
      setStatus('已清除本机保存的令牌');
    }
  </script>
</body>
</html>
